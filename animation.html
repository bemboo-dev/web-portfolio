  <main class="animation-page">

  <section class="animation-layout">

    <!-- 왼쪽 -->
    <div class="animation-main">

      <div class="main-player">
        <video
          id="featured-video"
          controls
          playsinline
          poster="video/cell.PNG"
        >
          <source src="video/video_cell.mp4" type="video/mp4">
        </video>
      </div>

      <div class="animation-description">
        <span id="featured-category">Medical Animation</span>

        <h1 id="featured-title">
          Abdominal Aortic Aneurysm Animation
        </h1>

        <p id="featured-description">
          복부 대동맥류의 발생 과정과 해부학적 변화를
          애니메이션으로 시각화한 작업입니다.
        </p>
      </div>

    </div>


    <!-- 오른쪽 추천 영상 -->
    <aside class="animation-sidebar">

      <button
        class="video-card active"
        data-video="video/2.mp4"
        data-poster="images/animation-thumb1.jpg"
        data-category="Medical Animation"
        data-title="Abdominal Aortic Aneurysm Animation"
        data-description="복부 대동맥류의 발생 과정과 해부학적 변화를 애니메이션으로 시각화한 작업입니다."
      >

        <img
          src="images/cell.PNG"
          alt="Animation 1"
        >

        <div class="video-card-info">
          <span>Medical Animation</span>
          <h2>Abdominal Aortic Aneurysm</h2>
        </div>

      </button>


      <button
        class="video-card"
        data-video="video/1.mp4"
        data-poster="images/animation-thumb2.jpg"
        data-category="Scientific Animation"
        data-title="Scientific Visualization 02"
        data-description="복잡한 과학적 개념을 단계적으로 설명하기 위한 애니메이션입니다."
      >

        <img
          src="images/cell.PNG"
          alt="Animation 2"
        >

        <div class="video-card-info">
          <span>Scientific Animation</span>
          <h2>Scientific Visualization 02</h2>
        </div>

      </button>


      <button
        class="video-card"

          src="images/animation-thumb3.jpg"
          alt="Animation 3"
        >

        <div class="video-card-info">
          <span>Medical Animation</span>
          <h2>Medical Visualization 03</h2>
        </div>

      </button>
